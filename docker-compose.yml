services:
  smart-frame-engine:
    # Published multi-arch image; `build` is used as a fallback (or with `--build`).
    image: ghcr.io/ant1fr/smart-frame-engine:latest
    build: .
    container_name: smart-frame-engine
    restart: unless-stopped
    # Run as the owner of ./data on the host (defaults to 1000:1000).
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - path: .env
        required: false
    # mDNS (ZEROCONF_ENABLED) needs host networking: replace `ports:` with
    # `network_mode: host` and set PORT in .env if 8080 is taken.
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/data
