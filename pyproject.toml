[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-frame-engine"
version = "0.1.0"
description = "Fetch photos and posters from modular sources, optimize them for color eInk, and push them to a Fraimic frame."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ant1fr" }]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pillow>=10.4",
    "pillow-heif>=0.20",
    "numpy>=2.0",
    "apscheduler>=3.10,<4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx2>=2.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/ant1fr/Smart-Frame-Engine"
Issues = "https://github.com/ant1fr/Smart-Frame-Engine/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed", "templates/*.html", "assets/fonts/*.ttf", "assets/fonts/*.txt"]

# --- Ruff -----------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["fraimic-docs", "tests/reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "ANN", "RUF"]
ignore = [
    "ANN401", # `Any` is legitimate for JSON payloads and ASGI plumbing.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- Pytest ---------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -m 'not slow'"
markers = ["slow: long-running performance tests (run with `pytest -m slow`)"]

# --- Mypy -----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["fraimic-docs/", "build/", "tests/reference/"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
