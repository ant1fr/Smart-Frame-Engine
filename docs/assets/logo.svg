<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="t">
  <title id="t">Smart Frame Engine</title>
  <!-- The frame: a warm-white eInk panel in a dark bezel -->
  <rect x="8" y="8" width="184" height="184" rx="22" fill="#1e293b"/>
  <rect x="24" y="24" width="152" height="152" rx="10" fill="#f8f5ee"/>
  <!-- The six Spectra 6 inks as a 3x2 palette: black, white, yellow, red, blue, green -->
  <rect x="40" y="40" width="38" height="38" rx="5" fill="#101010"/>
  <rect x="81" y="40" width="38" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="122" y="40" width="38" height="38" rx="5" fill="#f2cf1c"/>
  <rect x="40" y="81" width="38" height="38" rx="5" fill="#d1261b"/>
  <rect x="81" y="81" width="38" height="38" rx="5" fill="#2158c7"/>
  <rect x="122" y="81" width="38" height="38" rx="5" fill="#1f8a43"/>
  <!-- A dithered "photo" strip: the engine turns pictures into these six inks -->
  <g>
    <rect x="40" y="127" width="120" height="34" rx="5" fill="#2158c7"/>
    <circle cx="132" cy="140" r="8" fill="#f2cf1c"/>
    <path d="M40 161 L74 137 L98 152 L122 135 L160 161 Z" fill="#1f8a43"/>
    <g fill="#f8f5ee" opacity=".85">
      <rect x="52" y="131" width="3" height="3"/><rect x="64" y="134" width="3" height="3"/>
      <rect x="88" y="130" width="3" height="3"/><rect x="100" y="135" width="3" height="3"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="224" y="94" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="700" fill="#0f172a">Smart Frame</text>
  <text x="226" y="146" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="40" font-weight="400" letter-spacing="6" fill="#2158c7">ENGINE</text>
</svg>
