version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies]
