<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Smart Frame · Sign in</title>
  <script>
    // Theme before paint: saved choice, else the system preference.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("sfe-theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
</head>
<body class="h-full bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
  <main class="min-h-full flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm">
      <div class="flex flex-col items-center mb-8">
        <div class="grid grid-cols-3 gap-1 mb-4" aria-hidden="true">
          <span class="h-3 w-3 rounded-sm bg-black dark:bg-slate-200"></span>
          <span class="h-3 w-3 rounded-sm bg-red-500"></span>
          <span class="h-3 w-3 rounded-sm bg-yellow-400"></span>
          <span class="h-3 w-3 rounded-sm bg-blue-600"></span>
          <span class="h-3 w-3 rounded-sm bg-green-500"></span>
          <span class="h-3 w-3 rounded-sm bg-white ring-1 ring-slate-300 dark:ring-slate-600"></span>
        </div>
        <h1 class="text-2xl font-semibold tracking-tight">Smart Frame</h1>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Sign in to manage your frame</p>
      </div>

      <form id="login" class="rounded-2xl bg-white dark:bg-slate-900 shadow-sm ring-1 ring-slate-200 dark:ring-slate-800 p-6 space-y-5" novalidate>
        <div>
          <label for="username" class="block text-sm font-medium">User name</label>
          <input id="username" name="username" value="admin" autocomplete="username" required
            class="mt-1.5 block w-full rounded-lg border-0 bg-slate-50 dark:bg-slate-800 px-3 py-2 ring-1 ring-inset ring-slate-300 dark:ring-slate-700 focus:ring-2 focus:ring-blue-600 outline-none">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium" id="password-label">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus
            class="mt-1.5 block w-full rounded-lg border-0 bg-slate-50 dark:bg-slate-800 px-3 py-2 ring-1 ring-inset ring-slate-300 dark:ring-slate-700 focus:ring-2 focus:ring-blue-600 outline-none">
          <p id="hint" class="mt-1.5 text-xs text-slate-500 dark:text-slate-400 hidden">No admin password is set: sign in with the API key.</p>
        </div>
        <p id="error" role="alert" class="hidden text-sm text-red-600 dark:text-red-400"></p>
        <button id="submit" type="submit"
          class="w-full rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-60">
          Sign in
        </button>
      </form>
      <p class="mt-6 text-center text-xs text-slate-500 dark:text-slate-500">Home Assistant and the frame keep using the API key.</p>
    </div>
  </main>

  <script>
    (function () {
      var form = document.getElementById("login");
      var error = document.getElementById("error");
      var submit = document.getElementById("submit");

      function show(message) {
        error.textContent = message;
        error.classList.toggle("hidden", !message);
      }

      // Relative URLs only: the page may live under a reverse-proxy sub-path.
      fetch("./api/auth/session", { credentials: "same-origin" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (session) {
          if (!session) return;
          if (session.authenticated) { window.location.replace("./"); return; }
          if (session.mode === "key") {
            document.getElementById("password-label").textContent = "API key";
            document.getElementById("hint").classList.remove("hidden");
          }
        })
        .catch(function () {});

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        show("");
        submit.disabled = true;
        fetch("./api/auth/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json", "X-Requested-With": "SmartFrame" },
          body: JSON.stringify({
            username: form.username.value,
            password: form.password.value
          })
        })
          .then(function (r) {
            if (r.ok) { window.location.replace("./"); return; }
            if (r.status === 429) {
              var wait = r.headers.get("Retry-After");
              show("Too many attempts. Try again in " + (wait || "a few") + " seconds.");
            } else if (r.status === 409) {
              show("No login is configured on this instance.");
            } else {
              show("Wrong user name or password.");
            }
            form.password.select();
          })
          .catch(function () { show("Cannot reach the server."); })
          .finally(function () { submit.disabled = false; });
      });
    })();
  </script>
</body>
</html>
